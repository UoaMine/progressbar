<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bar</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:30px;
}

#container{
    max-width:600px;
    margin:auto;
}

#progress{
    width:100%;
    height:50px;
    background:#ddd;
    border-radius:25px;
    overflow:hidden;
}

#bar{
    width:0%;
    height:100%;
    background:#bdbdbd;
    transition:.5s;
}

#percent{
    font-size:32px;
    margin-top:20px;
    font-weight:bold;
}

#message{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}

#hitButton{
    display:none;
    margin-top:20px;
    padding:12px 24px;
    font-size:22px;
}

#popup{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.7);
}

#popupContent{
    background:white;
    max-width:500px;
    margin:120px auto;
    padding:20px;
    border-radius:10px;
}
</style>
</head>

<body>

<div id="container">

    <h1>Progress</h1>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <div id="percent">0%</div>

    <div id="message"></div>

    <button id="hitButton">🍑 HIT</button>

</div>

<div id="popup">

    <div id="popupContent">

        <div id="popupMessage"
             style="font-size:24px;margin-bottom:20px;">
        </div>

        <button id="closePopup">OK</button>

    </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRP6u9Ecb_drXafQrzuoztduHkZE4bE1E",
  authDomain: "kseftilismeni-porni.firebaseapp.com",
  databaseURL: "https://kseftilismeni-porni-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kseftilismeni-porni",
  storageBucket: "kseftilismeni-porni.firebasestorage.app",
  messagingSenderId: "173871802345",
  appId: "1:173871802345:web:b5ca7a18a6e2c84a378d78"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const progressRef = ref(db, "progress");

const hitButton = document.getElementById("hitButton");
const popup = document.getElementById("popup");
const popupMessage = document.getElementById("popupMessage");
const closePopup = document.getElementById("closePopup");

const messages = {
  5: "πολυ κυρία μου είσαι..",
  10: "πολυ κυρία μου είσαι.. για συνελθε",
  15: "για να έφτασες εδω.. κατι παει να γίνει",
  20: "χτυπα τη μουναρα σου για την κατάντια σου τωρα",
  25: "Ίσως πλέον να εχεις αρχίσει να καταλαβαίνεις. και που εισαι ακόμα..",
  30: "ξέρεις τι με καυλώνει. κότα",
  35: "οσο ξεφτιλιζεις τον εαυτό σου, τοσο με φτιάχνεις. βαλε δαχτυλο τοσες φορές οσο και το ποσοστό σου.",
  40: "η ξεφτιλα σου θα σε ανεβάσει κι άλλο. ξέρεις που...",
  45: "Μια ανάσα απο το να ξεπεράσεις το 50%.. μετα θα γίνεις πραγματική ζητιάνα",
  50: "Μπράβο αγάμητη καριόλα. μπράβο. Τωρα ξεκινά το μαρτύριό σου.",
  54: "53 φορές δάχτυλο χωρίς να χύσεις. δυνατά!!! να το ακούω!!",
  55: "55 φορές δάχτυλο χωρίς να χύσεις. δυνατά!!! να το ακούω!!",
  60: "Στείλε 3λεπτο βίντεο. να ξεφτιλιζεις τον εαυτό σου. χωρίς επαναλήψεις. και θα έχεις τρία δάχτυλα μεσα στο μουνί σου οσο υο γράφεις.",
  65: "Τωρα εξόπλισε τον εαυτό σου με υπομονή. κωδικός επιτυχίας: 'κι άλλα πρόσωπα'.",
  70: "Οσο καλά και να σου φέρομαι, ειναι ψέματα. Αν δεν ξεφτιλιστείς απόψε, δεν ανεβαίνει ποσοστό. Εχεις το κοινό σου.",
  75: "Κάνε ενα σεξουαλικό κομπλιμέντο στην Εβίτα. Μετά πίεσε το μουνί σου και σήκω να κου βάλεις νερό",
  80: "Πες στην Κορίνα οτι έχεις καύλες. με έξυπνο τρόπο, κοριτσίστικα. και μετά βάλε μου νερό.",
  85: "Πας μπάνιο, βάζεις δάχτυλο και τις χαϊδεύεις. διάλεξε όποια θες",
  90: "Πας έξω και λες στη Μαρία οτι είσαι πουτάνα.",
  95: "Παιξε το μουνί σου κρυφά αλλα απαγορεύεται να χύσεις.",
  100: "Με το σήμα μου, ξεβρακώνεσαι."
};

let previousValue = 0;

hitButton.addEventListener("click", () => {

    const currentValue = Number(hitButton.dataset.value);

    popupMessage.innerText =
        messages[currentValue] || "";

    popup.style.display = "block";

    hitButton.style.display = "none";
});

closePopup.addEventListener("click", () => {
    popup.style.display = "none";
});

onValue(progressRef, (snap) => {

    let value = snap.val() || 0;

    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const message = document.getElementById("message");

    bar.style.width = value + "%";

    let text = "";

    if(value < 25){
        bar.style.background = "#bdbdbd";
        text = "θα μείνεις αγαμητη;;;";
    }
    else if(value < 50){
        bar.style.background = "green";
        text = "το καλο είναι οτι πηρες μπρος.";
    }
    else if(value < 60){
        bar.style.background = "gold";
        text = "Μπράβο. εισαι μια ξεφτίλα. Σιχαμενη καριόλα για πούτσα. Και σε χαίρομαι.";
    }
    else if(value < 70){
        bar.style.background = "orange";
        text = "Εχω μείνει έκπληκτος. 🫪 Έφτασες μέχρι εδώ. τωρα εύχομαι γερό στομάχι...!";
    }
    
    else if(value < 80){
        bar.style.background = "orange";
        text = "Αποδείξεις εξουσίας για τον διάβολο 😈";
    }
    else if(value < 90){
        bar.style.background = "orangered";
        text = "Η βούληση σου σταματά εδώ. Προστάζω κι εκτελείς 🖤 ";
    }
    else if(value < 100){
        bar.style.background = "red";
        text = "σιχαμηνη καριόλα, ψωλοζητιανα. κοντεύεις";
    }
    else{
        bar.style.background = "darkred";
        text = "Πέρασες την πρώτη πίστα. 👉🏻👌🏻🥳";
    }

    const previousMilestone =
    Math.floor(previousValue / 5);

const currentMilestone =
    Math.floor(value / 5);

if (currentMilestone > previousMilestone) {

    const milestone = currentMilestone * 5;

    hitButton.dataset.value = milestone;

    hitButton.style.display = "inline-block";
}

previousValue = value;

    percent.innerText = value + "%";
    message.innerText = text;

});

</script>

</body>
</html>
