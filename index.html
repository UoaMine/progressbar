<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Bar</title>

<style>
body{
    font-family: Arial, sans-serif;
    text-align:center;
    padding:30px;
}

#container{
    max-width:600px;
    margin:auto;
}

#progress{
    width:100%;
    height:50px;
    background:#ddd;
    border-radius:25px;
    overflow:hidden;
}

#bar{
    width:0%;
    height:100%;
    background:#bdbdbd;
    transition:0.5s;
}

#percent{
    font-size:32px;
    margin-top:20px;
    font-weight:bold;
}

#message{
    margin-top:20px;
    font-size:24px;
    font-weight:bold;
}
</style>
</head>

<body>

<div id="container">
    <h1>Progress</h1>

    <div id="progress">
        <div id="bar"></div>
    </div>

    <div id="percent">0%</div>
    <div id="message"></div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBRP6u9Ecb_drXafQrzuoztduHkZE4bE1E",
  authDomain: "kseftilismeni-porni.firebaseapp.com",
  databaseURL: "https://kseftilismeni-porni-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "kseftilismeni-porni",
  storageBucket: "kseftilismeni-porni.firebasestorage.app",
  messagingSenderId: "173871802345",
  appId: "1:173871802345:web:b5ca7a18a6e2c84a378d78"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const progressRef = ref(db,"progress");

onValue(progressRef, (snap) => {

    let value = snap.val() || 0;

    const bar = document.getElementById("bar");
    const percent = document.getElementById("percent");
    const message = document.getElementById("message");

    bar.style.width = value + "%";

    let text = "";

    if(value < 25){
        bar.style.background = "#bdbdbd";
        text = "Θα μείνεις αγάμητη καριόλα!";
    }
    else if(value < 50){
        bar.style.background = "green";
        text = "νιώθω την ξεφτιλα σου!";
    }
    else if(value < 60){
        bar.style.background = "orange";
        text = "καλό πουτανακι. θες ακόμα!";
    }
    else if(value < 80){
        bar.style.background = "orange";
        text = "μπράβο ξεφτιλισμένη. μπορείς!!";
    }
    else if(value < 90){
        bar.style.background = "red";
        text = "Με καυλωσες αρκετά, σωστή πόρνη";
    }
    else if(value < 100){
        bar.style.background = "darkred";
        text = "κάγκελο η πούτσα, ψωλοζητιάνα!";
    }
    else{
        bar.style.background = "darkred";
        text = "ωρα για άγρια πούτσα";
    }

    percent.innerText = value + "%";
    message.innerText = text;

});

</script>

</body>
</html>
